<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYVRON — Behavior Prototype V10</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage">
    <canvas id="organism" aria-label="SYVRON organism behavior prototype"></canvas>

    <div class="behavior-console" aria-label="Behavior prototype controls">
      <button data-state="idle">IDLE</button>
      <button data-state="running">RUNNING</button>
      <button data-state="lap">LAP</button>
      <button data-state="pause">PAUSE</button>
      <button data-state="resume">RESUME</button>
      <button data-state="reset">RESET</button>
    </div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
